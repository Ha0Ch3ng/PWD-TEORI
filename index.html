<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <title>Document</title>
</head>
<body>
    <div class="box-data">

        <h2>
            Form Pendaftaran
        </h2>

        <div class="nama">
            <label for="nama">Nama Lengkap</label>
            <input type="text" id="nama" placeholder="Nama lengkap">
            <small id="peringatanNama"></small>
        </div>
       
        <div class="email">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="Email">
            <small id="peringatanEmail"></small>
        </div>

        <div class="no">
            <label for="no-hp">No Handphone</label>
            <input type="text" id="hp" placeholder="No Hp">
            <small id="peringatanNo"></small>
        </div>


        <select name="sesi" id="sesi">

            <option value="">Sesi</option>
            <option value="Pagi">Pagi</option>
            <option value="Sore">Sore</option>
            <option value="Malam">Malam</option>
        </select>

        <button class="submit">
            Daftar
        </button>
    </div>

    <script src="script.js"></script>
</body>
</html>
